name: web

# 只验证 Web 侧（构建 + 回归）。HAP 需要 DevEco SDK 与个人签名，不在 CI 里做。
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dev/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Committed HTML must match the source
        run: |
          if ! git diff --exit-code -- \
              ../refer/html/snowline-rally.html \
              ../app/entry/src/main/resources/rawfile/snowline-rally.html; then
            echo "::error::提交的 HTML 与源码不一致：请运行 npm run build，并把产物同步到 rawfile"
            exit 1
          fi
      - run: npm test
