<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>重力传感器自检</title>
<style>
  :root{--paper:#eef2f4;--dim:#8fa0ab;--ok:#7fe0a4;--bad:#ff7a6b;--bg:#0b0e10}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--paper);font:14px/1.6 ui-monospace,Menlo,monospace;padding:20px}
  h1{font-size:16px;letter-spacing:.18em;color:var(--dim);font-weight:500;margin:0 0 14px}
  .row{display:flex;justify-content:space-between;border-bottom:1px solid #1c2226;padding:6px 0}
  .k{color:var(--dim)}
  .ok{color:var(--ok)} .bad{color:var(--bad)}
  button{width:100%;padding:14px;margin:16px 0;background:#eef2f4;color:#0b0e10;border:0;font:600 15px/1 ui-monospace,monospace;letter-spacing:.1em}
  .bar{height:26px;border:1px solid #2a3338;position:relative;margin:12px 0}
  .bar i{position:absolute;top:0;bottom:0;background:#3b6ea8;width:0}
  .mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:#2a3338}
  .note{color:var(--dim);font-size:12px;margin-top:14px}
</style>
</head>
<body>
<h1>GRAVITY SENSOR SELF TEST</h1>
<div class="row"><span class="k">secure context</span><b id="sec">-</b></div>
<div class="row"><span class="k">DeviceMotionEvent</span><b id="dm">-</b></div>
<div class="row"><span class="k">DeviceOrientationEvent</span><b id="do">-</b></div>
<div class="row"><span class="k">screen.orientation.angle</span><b id="ang">-</b></div>
<div class="row"><span class="k">motion events</span><b id="mcount">0</b></div>
<div class="row"><span class="k">orientation events</span><b id="ocount">0</b></div>
<div class="row"><span class="k">accel x / y / z</span><b id="acc">-</b></div>
<div class="row"><span class="k">beta / gamma</span><b id="bg">-</b></div>
<div class="row"><span class="k">screen gx</span><b id="sgx">-</b></div>
<div class="bar"><i id="fill"></i><div class="mid"></div></div>
<button id="go">请求传感器权限 / 开始读取</button>
<p class="note">重力转向需要安全上下文：localhost 或 https。用 file:// 打开时浏览器不会给传感器数据。</p>
<script>
  const $ = (id) => document.getElementById(id);
  const ang = () => {
    let a = 0;
    if (screen.orientation && typeof screen.orientation.angle === 'number') a = screen.orientation.angle;
    else a = window.orientation || 0;
    return ((a % 360) + 360) % 360;
  };
  $('sec').textContent = window.isSecureContext ? '是 (secure)' : '否 (insecure)';
  $('sec').className = window.isSecureContext ? 'ok' : 'bad';
  $('dm').textContent = typeof DeviceMotionEvent !== 'undefined' ? '有' : '没有';
  $('dm').className = typeof DeviceMotionEvent !== 'undefined' ? 'ok' : 'bad';
  $('do').textContent = typeof DeviceOrientationEvent !== 'undefined' ? '有' : '没有';
  $('do').className = typeof DeviceOrientationEvent !== 'undefined' ? 'ok' : 'bad';
  $('ang').textContent = ang() + '°';
  let m = 0, o = 0;
  function setAcc(g) {
    if (!g) return;
    $('acc').textContent = [g.x, g.y, g.z].map((v) => (v == null ? 'null' : v.toFixed(2))).join(' / ');
    const a = (ang() * Math.PI) / 180;
    const gx = Math.cos(a) * g.x - Math.sin(a) * g.y;
    $('sgx').textContent = gx.toFixed(2);
    const w = Math.min(50, Math.abs(gx / 9.81) * 50);
    const f = $('fill');
    f.style.width = w + '%';
    f.style.left = gx >= 0 ? '50%' : (50 - w) + '%';
  }
  function onMotion(e) {
    m++; $('mcount').textContent = m;
    $('mcount').className = 'ok';
    setAcc(e.accelerationIncludingGravity);
  }
  function onOrient(e) {
    o++; $('ocount').textContent = o;
    $('ocount').className = 'ok';
    $('bg').textContent = (e.beta || 0).toFixed(1) + ' / ' + (e.gamma || 0).toFixed(1);
  }
  async function start() {
    try {
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        const r = await DeviceMotionEvent.requestPermission();
        if (r !== 'granted') { $('mcount').textContent = '拒绝 (' + r + ')'; $('mcount').className = 'bad'; return; }
      }
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        await DeviceOrientationEvent.requestPermission().catch(() => {});
      }
    } catch (err) {
      $('mcount').textContent = '错误 ' + err.message;
      $('mcount').className = 'bad';
    }
    window.addEventListener('devicemotion', onMotion, { passive: true });
    window.addEventListener('deviceorientation', onOrient, { passive: true });
    $('go').textContent = '监听中… 左右倾斜手机';
  }
  $('go').addEventListener('click', start);
</script>
</body>
</html>
